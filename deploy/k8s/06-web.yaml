---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: sshby
  labels:
    app.kubernetes.io/name: sshby
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sshby
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: sshby
  labels:
    app.kubernetes.io/name: sshby
    app.kubernetes.io/component: web
spec:
  # Web katmanı durumsuz (statik dosya + ters proxy), serbestçe ölçeklenebilir.
  # Tek kopya kısıtı yalnızca api'de.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sshby
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sshby
        app.kubernetes.io/component: web
    spec:
      securityContext:
        # nginxinc/nginx-unprivileged imajı uid/gid 101 ile çalışır ve 8080
        # dinler; ayrıcalıklı port bağlama yetkisi gerekmiyor.
        runAsUser: 101
        runAsGroup: 101
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: sshby-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            # Salt okunur kök için nginx'in yazdığı üç yer ayrı ayrı veriliyor.
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
