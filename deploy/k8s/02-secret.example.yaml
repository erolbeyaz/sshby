# ÖRNEK dosya — gerçek değerlerle doldurup `kubectl apply` etmeyin, kopyasını
# alın. Bu dosya depoda; doldurulmuş hâli asla depoya girmemeli.
#
# Değerleri üretin:
#
#   openssl rand -base64 32   # SSHBY_MASTER_KEY
#   openssl rand -hex 32      # JWT_SECRET
#   openssl rand -hex 24      # POSTGRES_PASSWORD
#
# POSTGRES_PASSWORD için `-hex` kullanın: değer DATABASE_URL'e gömülüyor ve
# base64 alfabesindeki `/` adresi bölüyor (migrate "getaddrinfo EAI_AGAIN" ile
# düşer). URL'de anlamı olan karakterleri kullanmayın: / @ : ? # % +
#
# Daha iyisi: dosya yerine komutla oluşturun, böylece değerler diske düşmez:
#
#   kubectl create secret generic sshby-secrets -n sshby \
#     --from-literal=SSHBY_MASTER_KEY="$(openssl rand -base64 32)" \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=POSTGRES_PASSWORD="$PGPASS" \
#     --from-literal=DATABASE_URL="postgres://sshby:$PGPASS@postgres:5432/sshby"
#
# Üretimde bu Secret'ı bir gizli veri yöneticisine (Sealed Secrets, External
# Secrets Operator, Vault) devretmek doğru olur — Kubernetes Secret'ları
# varsayılan olarak yalnızca base64, şifreli değil.
apiVersion: v1
kind: Secret
metadata:
  name: sshby-secrets
  namespace: sshby
  labels:
    app.kubernetes.io/name: sshby
type: Opaque
stringData:
  # Kasadaki tüm parolaları ve SSH anahtarlarını koruyan kök anahtar.
  # KAYBEDİLİRSE veritabanı yedeğiniz olsa bile hiçbir gizli veri geri
  # getirilemez. Küme dışında da bir kopyasını saklayın.
  SSHBY_MASTER_KEY: 'DEĞİŞTİRİN-openssl-rand-base64-32'
  SSHBY_MASTER_KEY_VERSION: '1'

  # Oturum jetonlarını imzalar. Değişirse açık oturumlar düşer, veri kaybı olmaz.
  JWT_SECRET: 'DEĞİŞTİRİN-openssl-rand-hex-32'

  POSTGRES_PASSWORD: 'DEĞİŞTİRİN-openssl-rand-hex-24'

  # Küme içindeki Postgres için. Dış (yönetilen) bir veritabanı kullanıyorsanız
  # yalnızca bu satırı değiştirin ve 03-postgres.yaml'ı uygulamayın.
  DATABASE_URL: 'postgres://sshby:DEĞİŞTİRİN-openssl-rand-hex-24@postgres:5432/sshby'
