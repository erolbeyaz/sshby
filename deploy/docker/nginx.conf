# sshby web katmanı: SPA'yı servis eder, /api ve /ws trafiğini api servisine taşır.
# Tarayıcı her şeyi tek origin üzerinden görür — cookie ve CSP tarafı basitleşir.

upstream sshby_api {
    # Compose'da "api", Kubernetes'te Service adı. Değiştirmek için imajı yeniden
    # kurmak yerine Helm'de bu dosyayı ConfigMap ile geçersiz kılabilirsiniz.
    server api:3000;
    keepalive 32;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Uygulama internete kapalı; yine de tarayıcı tarafı savunmaları açık tutuyoruz.
    include /etc/nginx/sshby-security-headers.conf;

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    client_max_body_size 0;   # SFTP yüklemeleri akış hâlinde geçer, sınır api tarafında.

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Hash'li varlıklar sonsuza kadar önbelleklenebilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass         http://sshby_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Büyük dosya indirmelerinde tamponlama belleği şişiriyor ve ilk baytı
        # geciktiriyor; akışı olduğu gibi geçir.
        proxy_buffering    off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Terminal ve metrik WebSocket'leri. Zaman aşımları uzun: bir SSH oturumu
    # saatlerce sessiz kalabilir.
    location /ws/ {
        proxy_pass         http://sshby_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering    off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA yönlendirmesi: bilinmeyen yollar index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html asla önbelleğe alınmamalı.
    #
    # Varlıklar içerik özetli adlar taşıyor ve sonsuza kadar önbelleklenebilir,
    # ama hangi varlıkların yükleneceğini index.html söylüyor. Tarayıcı onu
    # önbellekte tutarsa yeni sürüm dağıtıldıktan sonra da eski uygulamayı
    # çalıştırmaya devam eder — dağıtımın sessizce etkisiz kalması demek.
    location = /index.html {
        include /etc/nginx/sshby-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
